services:
  web:
    build: .
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    ports:
      - "3000:3000"
    command: node server.js
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build: .
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    command: node dist/main.js
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('fs'); try { const age=Date.now()-fs.statSync('/tmp/braiker-worker-heartbeat').mtimeMs; process.exit(age < 120000 ? 0 : 1); } catch { process.exit(1); }"]
      interval: 30s
      timeout: 5s
      retries: 3
