# DigitalOcean App Platform staging template. Inject every ${BRAIKER_*}
# placeholder as a SECRET at deployment time; never commit a real value here.
name: braiker-staging
region: nyc
services:
  - name: web
    github:
      repo: oskarvisual/braiker
      branch: staging
      deploy_on_push: false
    dockerfile_path: Dockerfile
    http_port: 3000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /api/health
      port: 3000
      initial_delay_seconds: 30
      period_seconds: 15
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
        value: ${BRAIKER_DATABASE_URL}
      - key: TRADING_MODE
        scope: RUN_TIME
        value: paper
      - key: APP_ENCRYPTION_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${BRAIKER_APP_ENCRYPTION_KEY}
      - key: SESSION_SECRET
        scope: RUN_TIME
        type: SECRET
        value: ${BRAIKER_SESSION_SECRET}
      - key: BOOTSTRAP_ADMIN_EMAIL
        scope: RUN_TIME
        type: SECRET
        value: ${BRAIKER_BOOTSTRAP_ADMIN_EMAIL}
      - key: BOOTSTRAP_ADMIN_PASSWORD
        scope: RUN_TIME
        type: SECRET
        value: ${BRAIKER_BOOTSTRAP_ADMIN_PASSWORD}
      - key: ALPACA_PAPER_BASE_URL
        scope: RUN_TIME
        value: https://paper-api.alpaca.markets
      - key: ALPACA_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${BRAIKER_ALPACA_API_KEY}
      - key: ALPACA_API_SECRET
        scope: RUN_TIME
        type: SECRET
        value: ${BRAIKER_ALPACA_API_SECRET}
      - key: AI_ENABLED
        scope: RUN_TIME
        value: "true"
      - key: OPENAI_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${BRAIKER_OPENAI_API_KEY}
      - key: TELEGRAM_BOT_TOKEN
        scope: RUN_TIME
        type: SECRET
        value: ${BRAIKER_TELEGRAM_BOT_TOKEN}
      - key: LOG_LEVEL
        scope: RUN_TIME
        value: info
workers:
  - name: worker
    github:
      repo: oskarvisual/braiker
      branch: staging
      deploy_on_push: false
    dockerfile_path: Dockerfile
    run_command: node dist/main.js
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    liveness_health_check:
      http_path: /healthz
      port: 8080
      initial_delay_seconds: 30
      period_seconds: 15
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
        value: ${BRAIKER_DATABASE_URL}
      - key: TRADING_MODE
        scope: RUN_TIME
        value: paper
      - key: APP_ENCRYPTION_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${BRAIKER_APP_ENCRYPTION_KEY}
      - key: SESSION_SECRET
        scope: RUN_TIME
        type: SECRET
        value: ${BRAIKER_SESSION_SECRET}
      - key: BOOTSTRAP_ADMIN_EMAIL
        scope: RUN_TIME
        type: SECRET
        value: ${BRAIKER_BOOTSTRAP_ADMIN_EMAIL}
      - key: BOOTSTRAP_ADMIN_PASSWORD
        scope: RUN_TIME
        type: SECRET
        value: ${BRAIKER_BOOTSTRAP_ADMIN_PASSWORD}
      - key: ALPACA_PAPER_BASE_URL
        scope: RUN_TIME
        value: https://paper-api.alpaca.markets
      - key: ALPACA_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${BRAIKER_ALPACA_API_KEY}
      - key: ALPACA_API_SECRET
        scope: RUN_TIME
        type: SECRET
        value: ${BRAIKER_ALPACA_API_SECRET}
      - key: AI_ENABLED
        scope: RUN_TIME
        value: "true"
      - key: OPENAI_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${BRAIKER_OPENAI_API_KEY}
      - key: TELEGRAM_BOT_TOKEN
        scope: RUN_TIME
        type: SECRET
        value: ${BRAIKER_TELEGRAM_BOT_TOKEN}
      - key: LOG_LEVEL
        scope: RUN_TIME
        value: info
      - key: WORKER_HEALTH_PORT
        scope: RUN_TIME
        value: "8080"
jobs:
  - name: migrate
    kind: PRE_DEPLOY
    github:
      repo: oskarvisual/braiker
      branch: staging
      deploy_on_push: false
    dockerfile_path: Dockerfile
    run_command: npm run prisma:migrate
    instance_size_slug: apps-s-1vcpu-0.5gb
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
        value: ${BRAIKER_DATABASE_URL}
